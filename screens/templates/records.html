<section class="page fade-in">
  <div class="page-heading"><div><div class="eyebrow">WORK RECORDS</div><h1>勤務記録</h1><p class="subtitle">{{RECORD_ACCESS_NOTE}}</p></div><button class="button primary" data-screen="entry"><span aria-hidden="true">＋</span> 実績を入力</button></div>
  <article class="panel"><div class="filter-row"><input id="record-search" type="search" placeholder="ドライバー名で検索" aria-label="ドライバー名で検索"><select id="date-filter" aria-label="日付で絞り込み"><option value="all">すべての日付</option><option value="today">今日</option></select><span class="panel-meta" id="record-count">{{RECORD_COUNT}} 件</span></div>
    <div class="table-wrap"><table><thead><tr><th>勤務日</th><th>ドライバー</th><th>勤務時間</th><th>実働時間</th><th>荷待ち</th><th>稼働率</th><th>操作</th></tr></thead><tbody>{{RECORD_ROWS}}</tbody></table>{{EMPTY_RECORDS}}<div class="empty" id="filter-empty" hidden>条件に一致する記録がありません</div></div>
  </article>
  <dialog id="record-edit-dialog" class="record-edit-dialog" aria-labelledby="record-edit-title">
    <form id="record-edit-form">
      <input type="hidden" name="recordId">
      <div class="edit-dialog-heading"><div><div class="eyebrow">EDIT WORK RECORD</div><h2 id="record-edit-title">勤務記録を編集</h2><p class="subtitle">時刻や休憩・荷待ちの内容を修正できます。</p></div><button class="dialog-close" type="button" data-close-edit aria-label="閉じる">×</button></div>
      <div class="edit-fields">
        <div class="field"><label for="edit-record-date">勤務日</label><input id="edit-record-date" name="date" type="date" required></div>
        <div class="field"><label for="edit-record-start">勤務開始時刻</label><input id="edit-record-start" name="start" type="time" required></div>
        <div class="field"><label for="edit-record-end">勤務終了時刻</label><input id="edit-record-end" name="end" type="time" required></div>
        <div class="field"><label for="edit-record-break">休憩時間（分）</label><input id="edit-record-break" name="breakMinutes" type="number" min="0" max="1440" step="1" required></div>
        <div class="field"><label for="edit-record-wait">荷待ち時間（分）</label><input id="edit-record-wait" name="waitMinutes" type="number" min="0" max="1440" step="1" required></div>
        <div class="field edit-note-field"><label for="edit-record-note">メモ</label><textarea id="edit-record-note" name="note" maxlength="300"></textarea></div>
      </div>
      <div class="form-actions"><button class="button ghost" type="button" data-close-edit>キャンセル</button><button class="button primary" type="submit">変更を保存</button></div>
    </form>
  </dialog>
</section>
