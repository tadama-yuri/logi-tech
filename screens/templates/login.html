<div class="login-wrap">
  <section class="login-art">
    <div class="login-logo"><div class="brand-mark">走</div><div><div class="brand-name">走録</div><div class="brand-caption">DRIVER WORK ANALYTICS</div></div></div>
    <div class="login-copy"><div class="eyebrow">DAILY OPERATIONS, CLEARLY.</div><h1>走る時間を、<br>次の改善へ。</h1><p>勤務実績と荷待ち時間をひとつに。現場の記録から、運行の見え方を変えていきます。</p></div>
