<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">走</div><div><div class="brand-name">走録</div><div class="brand-caption">DRIVER WORK ANALYTICS</div></div></div>
    <div class="nav-label">WORKSPACE</div><nav class="nav-list">{{NAV}}</nav>
    <div class="side-spacer"></div><div class="side-note">{{STORAGE_NOTE}}</div>
    <div class="side-user"><div class="avatar">{{INITIAL}}</div><div><div class="side-user-name">{{USER_NAME}}</div><div class="side-user-role">{{USER_ROLE}}</div></div></div>
  </aside>
  <main class="main"><header class="topbar"><div class="breadcrumb">走録 <span aria-hidden="true"> / </span> {{CURRENT_LABEL}}</div><div class="top-right"><span class="today">{{CURRENT_DATE}}</span><div class="user-chip"><span class="avatar">{{INITIAL}}</span>{{USER_NAME}}</div><button type="button" class="logout-button" data-logout><span aria-hidden="true">↪</span><span>ログアウト</span></button></div></header>{{SHIFT_REMINDER}}{{SCHEDULE_REMINDER}}{{CONTENT}}</main>
  <nav class="mobile-nav nav-columns-{{NAV_COLUMN_COUNT}}" aria-label="メインメニュー">{{NAV}}</nav>
</div><div class="toast" role="status"></div>
